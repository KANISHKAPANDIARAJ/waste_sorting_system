<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Waste System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            padding: 2.5rem 2rem;
        }
        
        .form-control {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
        }
        
        .form-control::placeholder {
            color: #cbd5e1;
            opacity: 1;
        }

        .form-label,
        .text-muted {
            color: #cbd5e1 !important;
        }

        .login-card h4 {
            color: #ffffff;
        }

        .login-card .small {
            color: #cbd5e1 !important;
        }

        .login-card strong {
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
            color: #f8fafc;
        }
        
        .btn-primary {
            background-color: #0284c7;
            border: none;
            font-weight: 600;
        }
        
        .btn-primary:hover {
            background-color: #0369a1;
        }
        
        .logo-wrap {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            color: #10b981;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4));
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-wrap">
            <i class="fa-solid fa-recycle fa-3x logo-icon mb-2"></i>
            <h4 class="fw-bold">Smart Waste System</h4>
            <p class="text-muted small">Industrial Segregation Platform</p>
        </div>
        
        <!-- Flash messages inside login card -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} py-2 px-3 small mb-3" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('dashboard.login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label small text-muted font-weight-bold">OPERATOR USERNAME</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter username" required autocomplete="off">
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label small text-muted font-weight-bold">SECURITY PASSWORD</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                Authorize Operator <i class="fa-solid fa-arrow-right ms-1"></i>
            </button>
            
            <div class="text-center text-muted small mt-2">
                <i class="fa-solid fa-lock me-1"></i> Use credentials: <strong>admin</strong> / <strong>admin123</strong>
            </div>
        </form>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
